---
- name: Установить Docker Engine и Compose v2
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Включить автозапуск Docker и запустить его
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Добавить deployer в группу docker
  ansible.builtin.user:
    name: "{{ deployer_user }}"
    groups: docker
    append: true
