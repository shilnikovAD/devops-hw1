name: hw1

services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, backend]
    depends_on: [app]
    restart: unless-stopped

  app:
    image: nginx:1.28-alpine
    volumes:
      - ./app:/usr/share/nginx/html:ro
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
